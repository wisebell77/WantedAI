# 민간 공고 자동 수집 — 목록 → 본문 → 이미지 판독 → 병합 → 커밋.
#
# 커밋이 main 에 들어가면 Railway 가 앱을 다시 빌드한다(약 20분). 그래서 매일이
# 아니라 주 3회로 돈다 — 목록이 썩지 않을 만큼은 되면서 재빌드 실패 위험은 줄인다.
#
# **수집 캐시는 레포에 넣지 않는다.** data/jd·jd_js·ocr 는 "이 URL 은 이미 받았다"는
# 상태일 뿐인데, 레포에 커밋하면 공개 저장소에 공고 본문이 계속 쌓인다.
# actions/cache 에 두면 실행 사이에는 남고 저장소에는 안 들어간다.
# 캐시가 날아가도 스크립트가 다시 받을 뿐 결과는 같다(느려질 뿐이다).
#
# 처음에는 수동으로 한 번 돌려 보는 것을 권한다 — Actions 탭 > Run workflow.

name: 민간 공고 갱신

on:
  # **크론을 껐다.** 로컬에서 scripts/refresh_local.py 로 돌리고 사람이 푸시한다.
  # 자동 실행 자체는 돌았지만(9/20 에 +97건) 결과를 확인하는 비용이 얻는 것보다
  # 컸다 — 로그를 보려면 브라우저를 열어야 하고, 어디서 끊겼는지 알기 어렵고,
  # 크론이 예고 없이 푸시하면 심사 기간에 앱이 20분간 재빌드된다.
  # 수동 실행은 남겨 둔다. 되살리려면 아래 두 줄의 주석만 풀면 된다.
  #   schedule:
  #     - cron: "0 20 * * 0,2,4"    # UTC 20:00 = 한국시간 05:00 (월·수·금)
  workflow_dispatch:
    inputs:
      skip_ocr:
        description: "이미지 판독을 건너뛴다 (LLM 키 없이 돌릴 때)"
        type: boolean
        default: false
      ocr_limit:
        description: "판독할 공고 수 상한 (0 = 제한 없음). 크레딧이 빠듯하면 줄인다"
        type: string
        default: "0"

concurrency:                      # 앞 실행이 아직 돌면 새로 시작하지 않는다
  group: refresh-postings
  cancel-in-progress: false

permissions:
  contents: write                 # 결과를 main 에 되돌려 커밋한다

jobs:
  refresh:
    runs-on: ubuntu-latest
    # **여기가 터지면 안 된다.** job 타임아웃은 취소로 끝나고, 취소되면 post 스텝이
    # 건너뛰어져 캐시가 저장되지 않는다 — 2차 실행에서 ②③ 이 성공했는데도 받은
    # 걸 전부 잃었다. GitHub 기본값도 6시간이라 원래 여유가 있었는데 60분으로
    # 조여 둔 게 화근이었다.
    #
    # 실제 제어는 **단계별 timeout** 이 한다. 그건 그 스텝만 끝내고 job 은 계속돼
    # 캐시도 남고 ⑦~⑨ 도 돈다. 여기 값은 무언가 정말 멈췄을 때만 걸리는 최후 방어선이다.
    #   단계 합계 ② 30 + ③ 120 + ④ 45 = 195분, ⑤⑥ 은 상한 없음 (+ 준비 6분)
    timeout-minutes: 330

    env:
      # 파이썬이 출력을 버퍼링하면 진행 로그가 안 보인다. 첫 실행에서 브라우저
      # 수집이 30분 동안 아무것도 안 찍어 멈춘 줄 알았다 — 실제로는 돌고 있었다.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성
        run: |
          python -m pip install --quiet --upgrade pip
          # 수집·판독에 필요한 것만. torch 는 필요 없다 —
          # 역량 추출(임베딩)은 엔진 컨테이너가 하고 여기서는 안 돈다.
          # python-dotenv 는 overlap/config.py 가 모듈 최상위에서 import 한다.
          # lxml 이 빠지면 fetch_jd.py 의 BeautifulSoup(html, "lxml") 이
          # FeatureNotFound 로 죽는다 — 첫 실행에서 415건이 그렇게 날아갔다.
          pip install --quiet requests beautifulsoup4 lxml pillow olefile \
                              python-dotenv "numpy>=2.0" playwright

      - name: 브라우저 설치
        # probe_images.py 와 fetch_jd_js.py 가 Playwright 를 쓴다. 컨테이너에는
        # 무거워서 못 넣었지만 Actions 러너에서는 문제없다 — 오히려 여기서
        # 브라우저 렌더링분(83건 계열)까지 자동으로 건질 수 있다.
        run: playwright install --with-deps chromium

      # 캐시는 "이미 받은 URL" 목록이다. 없으면 전부 다시 받게 되는데,
      # 느린 것보다 상대 사이트에 실례라는 점이 더 크다.
      - name: 수집 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            data/jd
            data/jd_js
            data/ocr
            data/ocr_img
            data/ocr_manifest.json
            data/imgprobe.json
          key: overlap-collect-${{ github.run_id }}
          restore-keys: overlap-collect-

      - name: 작업 공간 준비
        run: |
          set -eu
          mkdir -p data/jd data/jd_js data/ocr data/ocr_img data/probe
          # 레포의 배포본(data/overlap)을 스크립트가 기대하는 data/ 로 가져온다.
          # 스크립트들이 Path("data/...") 를 하드코딩해서 OVERLAP_DATA 를 안 본다.
          cp data/overlap/gongchae_all.json data/ 2>/dev/null || true
          cp data/overlap/gongchae_all.json data/probe/ 2>/dev/null || true
          cp data/overlap/roles.json        data/ 2>/dev/null || true
          cp data/overlap/jd_tiered.json    data/ 2>/dev/null || true
          cp data/overlap/analysis.json     data/ 2>/dev/null || true
          # 한글 폴더명이 깨진 채 커밋돼 있어 그대로 따옴표로 참조한다.
          cp 'data/overlap/#Ubbfc#Uac04#Uacf5#Uace0/jd_good.json' data/ 2>/dev/null || true
          cp 'data/overlap/#Ubbfc#Uac04#Uacf5#Uace0/corpus.json'  data/ 2>/dev/null || true
          # **판독 결과는 레포에서 되살린다.** ⑥ 은 돈이 드는 단계라 캐시만 믿으면
          # 안 된다 — 2차 실행이 취소되면서 캐시가 날아갔고, 그대로 두면 이미 읽은
          # 90건을 다시 읽어 $4.5 를 또 쓸 뻔했다. 캐시에 더 최신 것이 있으면 그게 이긴다.
          cp -n data/overlap/ocr/*.json data/ocr/ 2>/dev/null || true
          cp -n data/overlap/ocr_manifest.json data/ 2>/dev/null || true
          cp -n data/overlap/imgprobe.json     data/ 2>/dev/null || true
          echo "판독 완료분 $(ls data/ocr/*.json 2>/dev/null | wc -l)건 복원"
          ls -la data/ | head -20

      - name: ① 공채속보 목록 갱신
        env:
          # 공채속보(고용24)만 쓴다. ALIO(DATA_GO_KR_KEY)는 공공 직무기술서용이라
          # 이 파이프라인과 무관하다 — 엔진 산출물을 다시 만들 때만 필요하다.
          WORK24_KEY_RECRUIT: ${{ secrets.WORK24_KEY_RECRUIT }}
        run: |
          # refresh_private.py 를 통째로 돌리면 목록 갱신 + 병합 + 직무분해를 다 한다.
          # 그런데 이 시점에는 아직 본문을 안 받아서 캐시가 비어 있고, 병합 결과가
          # 0 건이 되어 roles.json 을 0 개로 덮어쓴다(첫 실행에서 실제로 그랬다).
          # 여기서는 목록만 갱신하고, 병합은 본문 수집이 끝난 ⑦ 에서 한다.
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from overlap.collect import GongchaeClient
          d = GongchaeClient().refresh()
          print(f"공채속보 total {d.total} / 누적 {d.stored}건 "
                f"· 신규 {len(d.new)}건 · 목록에서 사라짐 {d.gone}건")
          PY
            # **갱신한 목록을 ② 가 읽는 자리로 옮긴다.** 이게 없으면 파이프라인이
            # 한 박자 늦게 돈다 — ① 은 data/gongchae_all.json 에 쓰는데 ② 는
            # data/probe/gongchae_all.json 을 읽고, 그건 준비 단계가 복사한 갱신
            # 전 목록이다. 9/20 실행에서 공고는 542→639 로 늘었는데 본문은
            # 291→286 으로 줄었다. 새로 들어온 97건을 한 건도 안 받은 것이다.
            cp data/gongchae_all.json data/probe/gongchae_all.json

      - name: ② 본문 수집 (static · robots.txt 준수)
        continue-on-error: true       # 일부 도메인이 막혀도 나머지는 살린다
        # 시간 상한을 둔다. 대상이 수백 건이라 상한이 없으면 이 단계가
        # job 전체를 먹고 병합·커밋까지 못 간다. 받은 만큼은 캐시에 남아
        # 다음 실행이 이어받으므로 중간에 끊겨도 손해가 없다.
        run: timeout 1800 python scripts/fetch_jd.py || echo '시간 상한 — 받은 만큼만 쓰고 넘어간다'

      - name: ③ 본문 수집 (브라우저 렌더링)
        continue-on-error: true
        # 브라우저 렌더링이라 건당 10~20초다. 464건이면 2시간쯤 걸린다.
        # 한 번에 다 받게 두되, 정말 멈추면 2시간에서 끊는다.
        run: timeout 7200 python scripts/fetch_jd_js.py || echo '시간 상한 — 받은 만큼만 쓰고 넘어간다'

      - name: ④ 이미지형 공고 판별
        continue-on-error: true
        run: timeout 2700 python scripts/probe_images.py || echo '시간 상한 — 판별된 만큼만'

      - name: ⑤ 판독용 조각 준비
        continue-on-error: true
        # 상한을 두지 않는다. 여기서 끊기면 조각이 반만 만들어진 공고가 생기고,
        # ⑥ 이 그걸 읽어 반쪽짜리 본문을 저장한다. 끝까지 두는 편이 안전하다.
        run: python scripts/ocr_prep.py

      - name: ⑥ 이미지 판독 (비전 모델)
        if: ${{ !inputs.skip_ocr }}
        continue-on-error: true
        env:
          # 키만 Secret 이다. URL·모델명은 민감하지 않고, Secret 으로 넣으면
          # 로그에서 *** 로 가려져 무엇이 돌았는지 못 본다.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
        # 상한을 두지 않는다. 공고 단위로 저장하므로 중간에 끊겨도 손해는 없지만,
        # API 호출이라 다시 돌리면 그만큼 크레딧을 또 쓴다. 한 번에 끝내는 게 낫다.
        run: |
          LIMIT='${{ inputs.ocr_limit }}'
          if [ -n "$LIMIT" ] && [ "$LIMIT" != '0' ]; then
            python scripts/ocr_read.py --limit "$LIMIT"
          else
            python scripts/ocr_read.py
          fi

      - name: ⑦ 병합 + 직무 분해
        run: |
          set -eu
          python pipelines/refresh_private.py --merge-only
          # post_tier 는 RoleSplitter 가 안 넣는다. 레거시 스크립트로 다시 만들어야
          # persona 의 load_roles(tier="A") 와 job_market() 이 산다.
          python scripts/split_roles.py
          # jd_tiered 는 앱이 공고 본문을 읽는 유일한 통로다. 빼먹으면 본문을
          # 아무리 모아도 앱은 지난번 것만 본다(실제로 221건에 멈춰 AI 코치가
          # 17건에만 붙었다). split_roles 와 같은 입력(jd_good)을 쓴다.
          python scripts/build_tiered.py

      - name: ⑧ 배포본으로 되돌리기 (줄어들면 반영하지 않는다)
        run: |
          python - <<'PY'
          import json, shutil, datetime, sys

          # **줄어든 결과를 덮어쓰지 않는다.** 수집이 실패하면 병합이 0 건을 내는데,
          # 그걸 그대로 배포본에 넣고 커밋하면 앱이 빈 목록으로 뜬다.
          # 첫 실행에서 실제로 jd_good 0 건 · 직무 0 개가 나왔다.
          PRIV = "data/overlap/#Ubbfc#Uac04#Uacf5#Uace0"
          PAIRS = [("data/gongchae_all.json", "data/overlap/gongchae_all.json"),
                   ("data/roles.json",        "data/overlap/roles.json"),
                   ("data/jd_good.json",      f"{PRIV}/jd_good.json"),
                   ("data/corpus.json",       f"{PRIV}/corpus.json")]

          def count(path):
              try:
                  d = json.load(open(path, encoding="utf-8"))
                  return len(d) if isinstance(d, (list, dict)) else 0
              except Exception:
                  return 0

          skipped = []
          for src, dst in PAIRS:
              ns, nd = count(src), count(dst)
              if ns == 0 or ns < nd * 0.8:      # 20% 넘게 줄면 의심한다
                  print(f"  건너뜀  {dst}  새 {ns}건 / 기존 {nd}건")
                  skipped.append(dst)
                  continue
              shutil.copyfile(src, dst)
              print(f"  반영    {dst}  {nd} → {ns}건")

          # 새로 판독한 것을 배포본으로 옮긴다. 여기 있어야 다음 실행이 되살린다.
          import glob, os
          os.makedirs("data/overlap/ocr", exist_ok=True)
          moved = 0
          for f in glob.glob("data/ocr/*.json"):
              dst = os.path.join("data/overlap/ocr", os.path.basename(f))
              if not os.path.exists(dst) or os.path.getsize(f) != os.path.getsize(dst):
                  shutil.copyfile(f, dst); moved += 1
          for f in ("ocr_manifest.json", "imgprobe.json"):
              if os.path.exists(f"data/{f}"):
                  shutil.copyfile(f"data/{f}", f"data/overlap/{f}")
          print(f"  판독 결과 {moved}건 반영 (누적 {len(glob.glob('data/overlap/ocr/*.json'))}건)")

          g = json.load(open("data/overlap/gongchae_all.json", encoding="utf-8"))
          t = datetime.date.today().strftime("%Y%m%d")
          live = [x for x in g if str(x.get("empWantedEndt", "")) >= t]
          r = json.load(open("data/overlap/roles.json", encoding="utf-8"))
          print("")
          print(f"배포본: 누적 {len(g)}건 · 모집 중 {len(live)}건 · 직무 {len(r)}개")
          if skipped:
              print(f"⚠ {len(skipped)}개 파일이 줄어서 반영되지 않았다. 수집 단계 로그를 볼 것.")
          PY

      - name: ⑨ 변경분 커밋
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 배포본만 커밋한다. data/jd 같은 캐시는 actions/cache 에 남는다.
          # 판독 결과(data/ocr)도 배포본 안에 있으므로 같이 커밋된다.
          # 다음 실행이 이걸 되살려 같은 공고를 다시 읽지 않는다.
          git add data/overlap
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "데이터: 민간 공고 자동 갱신 ($(date -u +%Y-%m-%d))"
          # 이 작업이 도는 40분 사이에 누가 main 에 푸시하면 그냥 push 는 거부된다
          # (non-fast-forward). 수집은 다 해놓고 마지막에 실패하는 건 아깝다.
          # 우리 커밋은 data/overlap 만 건드리니 rebase 로 얹으면 충돌이 날 일이 없다.
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "3회 모두 실패했다. 수집 결과는 캐시에 남아 있으니 다시 돌리면 이어받는다."
          exit 1
